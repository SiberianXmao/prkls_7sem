server:
  port: 8080

spring:
  application:
    name: delivery-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  r2dbc:
    url: ${DB_URL:r2dbc:postgresql://localhost:5443/deliveries_db}
    username: ${DB_USER:delivery_user}
    password: ${DB_PASSWORD:delivery_password}
  sql:
    init:
      mode: always
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:pr8}
    password: ${RABBITMQ_PASSWORD:pr8_password}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 250ms

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
