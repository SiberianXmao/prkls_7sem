name: pr8-microservices

services:
  traefik:
    image: traefik:v3.5
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --ping=true
    ports:
      - "${TRAEFIK_PORT:-8090}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8091}:8080"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - edge

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: -XX:InitialRAMPercentage=15 -XX:MaxRAMPercentage=40
    ports:
      - "${KEYCLOAK_PORT:-8092}:8080"
    volumes:
      - ./keycloak/pr8-realm.json:/opt/keycloak/data/import/pr8-realm.json:ro
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    ports:
      - "${CONFIG_SERVER_PORT:-8889}:8888"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped
    networks:
      - backend

  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
    ports:
      - "${EUREKA_PORT:-8762}:8761"
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pr8}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pr8_password}
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped
    networks:
      - backend

  supplier-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: suppliers_db
      POSTGRES_USER: supplier_user
      POSTGRES_PASSWORD: supplier_password
    ports:
      - "${SUPPLIER_DB_PORT:-5441}:5432"
    volumes:
      - supplier_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplier_user -d suppliers_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - backend

  order-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_password
    ports:
      - "${ORDER_DB_PORT:-5442}:5432"
    volumes:
      - order_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d orders_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - backend

  delivery-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: deliveries_db
      POSTGRES_USER: delivery_user
      POSTGRES_PASSWORD: delivery_password
    ports:
      - "${DELIVERY_DB_PORT:-5443}:5432"
    volumes:
      - delivery_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery_user -d deliveries_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - backend

  supplier-service:
    build:
      context: .
      dockerfile: supplier-service/Dockerfile
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      DB_URL: jdbc:postgresql://supplier-db:5432/suppliers_db
      DB_USER: supplier_user
      DB_PASSWORD: supplier_password
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      supplier-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks:
      - backend

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      DB_URL: jdbc:postgresql://order-db:5432/orders_db
      DB_USER: order_user
      DB_PASSWORD: order_password
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-pr8}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pr8_password}
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      order-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      supplier-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks:
      - backend

  delivery-service:
    build:
      context: .
      dockerfile: delivery-service/Dockerfile
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      DB_URL: r2dbc:postgresql://delivery-db:5432/deliveries_db
      DB_USER: delivery_user
      DB_PASSWORD: delivery_password
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-pr8}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pr8_password}
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      delivery-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks:
      - backend

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      JWK_SET_URI: http://keycloak:8080/realms/pr8/protocol/openid-connect/certs
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      supplier-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s
    restart: unless-stopped
    networks:
      - edge
      - backend

volumes:
  keycloak_data:
  supplier_db_data:
  order_db_data:
  delivery_db_data:

networks:
  edge:
    name: pr8-edge
  backend:
    name: pr8-backend
