server:
  port: 8080

spring:
  application:
    name: order-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5442/orders_db}
    username: ${DB_USER:order_user}
    password: ${DB_PASSWORD:order_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:pr8}
    password: ${RABBITMQ_PASSWORD:pr8_password}
  cloud:
    openfeign:
      client:
        config:
          supplier-service:
            connect-timeout: 700
            read-timeout: 1000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

resilience4j:
  circuitbreaker:
    instances:
      supplierCatalog:
        register-health-indicator: true
        sliding-window-size: 6
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  retry:
    instances:
      supplierCatalog:
        max-attempts: 2
        wait-duration: 150ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-none}]"
